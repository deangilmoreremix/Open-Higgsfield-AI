packages:
  - 'packages/*'
  - 'apps/*'
  - '!apps/vimax/**'
  - '!apps/ai-shorts-generator/**'
  - '!apps/ai-influencer-generator/**'
  - '!apps/ai-video-outreach/**'
  - '!apps/studio-app/**'
allowBuilds:
  '@google/genai': true
  '@prisma/client': true
  '@prisma/engines': true
  aws-sdk: true
  canvas: true
  core-js: true
  core-js-pure: true
  es5-ext: true
  esbuild: true
  husky: true
  prisma: true
  protobufjs: true
  puppeteer: true
  sharp: true
  unrs-resolver: true
  workerd: true
