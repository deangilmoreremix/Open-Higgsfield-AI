[build]
  publish = "dist"
  # Use pnpm for consistent monorepo workspace support
  command = "pnpm install && pnpm run build:all"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  NODE_PACKAGE_MANAGER = "pnpm"

# Environment variables are set via Netlify CLI or dashboard
# Do not commit secrets to this file

# Frontend Environment Variables (for local development)

# Add build hooks if needed
[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.html]
  pretty_urls = true