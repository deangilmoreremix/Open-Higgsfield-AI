[build]
  publish = "dist"
  command = "npm run build"
  working_dir = "/"

[build.environment]
  NODE_VERSION = "18"

# Add build hooks if needed
[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.html]
  pretty_urls = true

# Environment variables (will be set in Netlify dashboard)
# VITE_SUPABASE_URL
# VITE_SUPABASE_ANON_KEY  
# VITE_MUAPI_URL