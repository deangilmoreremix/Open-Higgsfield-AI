# Netlify Configuration - Single Source of Truth
# This file consolidates all Netlify-specific configuration for the Open-Higgsfield-AI monorepo

[build]
  publish = "dist"
  command = "npx vite build"
  functions = "netlify/functions/dist"

[build.environment]
  NODE_VERSION = "20"
  NODE_PACKAGE_MANAGER = "pnpm"
  NODE_OPTIONS = "--max-old-space-size=4096"
  COREPACK_INTEGRITY_KEYS = "0"
  PNPM_FLAGS = "--no-frozen-lockfile"

[functions]
  # Serverless functions directory
  directory = "netlify/functions/dist"
  
  # Function-level configuration
  [functions."*"]
    # 60-second timeout for long-running AI operations
    timeout = 60
    # 1GB memory for video processing functions
    memory = 1024

# Redirects: SPA routing, API proxy, and app-specific routing
# API proxy - must be before SPA fallback
[[redirects]]
  from = "/api/*"
  to = "https://api.muapi.ai/:splat"
  status = 200
  force = false

# App redirects - must be before SPA fallback
[[redirects]]
  from = "/apps/storyboarder/*"
  to = "/apps/storyboarder/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/apps/agents-studio/*"
  to = "/apps/agents-studio/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/apps/studio/*"
  to = "/apps/studio/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/apps/assistant/*"
  to = "/apps/assistant/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/apps/workflow/*"
  to = "/apps/workflow/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/apps/vibe-workflow/*"
  to = "/apps/vibe-workflow/index.html"
  status = 200
