<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g_cyberpunk-style" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <radialGradient id="s_cyberpunk-style" cx="30%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="r_cyberpunk-style" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="blur_cyberpunk-style" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <rect width="640" height="360" fill="url(#g_cyberpunk-style)"/>
  <rect width="640" height="360" fill="url(#s_cyberpunk-style)"/>

  <g opacity="0.18" transform="translate(12 9) rotate(-13 320 180)">
    <circle cx="120" cy="80" r="98" fill="none" stroke="url(#r_cyberpunk-style)" stroke-width="2"/>
    <circle cx="520" cy="280" r="78" fill="none" stroke="url(#r_cyberpunk-style)" stroke-width="1.5"/>
  </g>

  <circle cx="80" cy="60" r="14" fill="#dbeafe" opacity="0.35"/>
  <circle cx="560" cy="100" r="8" fill="#dbeafe" opacity="0.5"/>
  <circle cx="600" cy="320" r="20" fill="#dbeafe" opacity="0.25"/>
  <circle cx="40" cy="300" r="10" fill="#dbeafe" opacity="0.4"/>

  <g transform="translate(320 150)">
    <circle r="78" fill="#ffffff" opacity="0.18" filter="url(#blur_cyberpunk-style)"/>
    <circle r="62" fill="#ffffff" opacity="0.95"/>
    <text x="0" y="22" text-anchor="middle" font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif" font-size="64">🌃</text>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" fill="#ffffff">
    <text x="320" y="270" text-anchor="middle" font-size="22" font-weight="700" letter-spacing="-0.3">Cyberpunk Style</text>
    <text x="320" y="296" text-anchor="middle" font-size="11" font-weight="600" letter-spacing="2" opacity="0.75">STYLE TRANSFER</text>
  </g>

  
  <g transform="translate(572 24)">
    <rect x="0" y="0" width="56" height="22" rx="11" fill="rgba(0,0,0,0.45)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <text x="28" y="15" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#ffffff" letter-spacing="1">IMAGE</text>
  </g>
</svg>