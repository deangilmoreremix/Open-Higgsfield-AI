    <line x1="80" y1="0" x2="80" y2="300" stroke="white" stroke-width="0.5"/>
    <line x1="100" y1="0" x2="100" y2="300" stroke="white" stroke-width="0.5"/>
    <line x1="120" y1="0" x2="120" y2="300" stroke="white" stroke-width="0.5"/>
    <line x1="140" y1="0" x2="140" y2="300" stroke="white" stroke-width="0.5"/>
    <line x1="160" y1="0" x2="160" y2="300" stroke="white" stroke-width="0.5"/>
    <line x1="180" y1="0" x2="180" y2="300" stroke="white" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="300" stroke="white" stroke-width="0.5"/>
    <line x1="220" y1="0" x2="220" y2="300" stroke="white" stroke-width="0.5"/>
    <line x1="240" y1="0" x2="240" y2="300" stroke="white" stroke-width="0.5"/>
    <line x1="260" y1="0" x2="260" y2="300" stroke="white" stroke-width="0.5"/>
    <line x1="280" y1="0" x2="280" y2="300" stroke="white" stroke-width="0.5"/>
    <line x1="300" y1="0" x2="300" y2="300" stroke="white" stroke-width="0.5"/>
    <line x1="320" y1="0" x2="320" y2="300" stroke="white" stroke-width="0.5"/>
    <line x1="340" y1="0" x2="340" y2="300" stroke="white" stroke-width="0.5"/>
    <line x1="360" y1="0" x2="360" y2="300" stroke="white" stroke-width="0.5"/>
    <line x1="380" y1="0" x2="380" y2="300" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="0" x2="400" y2="0" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="20" x2="400" y2="20" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="40" x2="400" y2="40" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="60" x2="400" y2="60" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="80" x2="400" y2="80" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="100" x2="400" y2="100" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="120" x2="400" y2="120" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="140" x2="400" y2="140" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="160" x2="400" y2="160" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="180" x2="400" y2="180" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="400" y2="200" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="220" x2="400" y2="220" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="240" x2="400" y2="240" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="260" x2="400" y2="260" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="280" x2="400" y2="280" stroke="white" stroke-width="0.5"/>
