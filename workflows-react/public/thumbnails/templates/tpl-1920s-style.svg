  <!-- Glow effect -->
  <ellipse cx="200" cy="130" rx="100" ry="80" fill="url(#glow-tpl-1920s-style)"/>

  <!-- Icon circle -->
  <circle cx="200" cy="120" r="50" fill="#FACC15" opacity="0.2"/>
  <circle cx="200" cy="120" r="40" fill="none" stroke="#FACC15" stroke-width="2"/>

  <!-- Icon -->
  <text x="200" y="135" font-size="40" text-anchor="middle" fill="white">🕰️</text>

  <!-- Title -->
  <text x="200" y="210" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="white" text-anchor="middle">1920s Style</text>

  <!-- Description -->
  <text x="200" y="235" font-family="system-ui, sans-serif" font-size="12" fill="#FACC15" text-anchor="middle" opacity="0.9">Roaring twenties</text>

  <!-- Category badge -->
  <rect x="155" y="255" width="90" height="24" rx="12" fill="#FACC15" opacity="0.2"/>
  <text x="200" y="272" font-family="system-ui, sans-serif" font-size="10" font-weight="500" fill="#FACC15" text-anchor="middle" text-transform="uppercase">decade</text>

  <!-- Corner accents -->
  <path d="M0 0 L30 0 L0 30 Z" fill="#FACC15" opacity="0.3"/>
  <path d="M400 300 L370 300 L400 270 Z" fill="#FACC15" opacity="0.3"/>
