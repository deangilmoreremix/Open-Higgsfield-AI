<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-tpl-1920s-style" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#CA8A04;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glow-tpl-1920s-style" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FACC15;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#FACC15;stop-opacity:0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="url(#bg-tpl-1920s-style)"/>

  <!-- Grid pattern -->
  <g opacity="0.1">
    <line x1="0" y1="0" x2="0" y2="300" stroke="white" stroke-width="0.5"/>
    <line x1="20" y1="0" x2="20" y2="300" stroke="white" stroke-width="0.5"/>
    <line x1="40" y1="0" x2="40" y2="300" stroke="white" stroke-width="0.5"/>
