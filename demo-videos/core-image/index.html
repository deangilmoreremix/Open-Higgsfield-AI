<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0; width: 1920px; height: 1080px; overflow: hidden;
        background: #0a0a0a; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }
      .header {
        position: absolute; top: 0; left: 0; right: 0; height: 80px;
        background: #1a1a2e; border-bottom: 2px solid #2a2a4e;
        display: flex; align-items: center; padding: 0 40px;
      }
      .content {
        position: absolute; top: 80px; left: 0; right: 0; bottom: 0;
        display: flex; padding: 40px; gap: 40px;
      }
      .panel {
        background: #1a1a2e; border: 2px solid #2a2a4e; border-radius: 12px;
        padding: 30px; color: #fff; flex: 1;
      }
      .panel-title {
        font-size: 24px; font-weight: bold; margin-bottom: 30px; color: #4a90e2;
      }
      .feature-box {
        background: #0f0f1a; border: 2px solid #2a2a4e; border-radius: 8px;
        padding: 20px; margin-bottom: 20px; color: #fff; opacity: 0;
      }
      .preview-box {
        background: #0f0f1a; border: 2px solid #2a2a4e; border-radius: 12px;
        display: flex; align-items: center; justify-content: center;
        color: #aaa; font-size: 18px; flex: 1;
      }
      .feature-label {
        position: absolute; color: #4a90e2; font-size: 28px; font-weight: bold; opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="image" data-start="0" data-duration="15" data-width="1920" data-height="1080">
      <div class="clip" data-start="0" data-duration="15" data-track-index="0"
           style="position: absolute; top: 0; left: 0; right: 0; height: 80px; background: #1a1a2e; border-bottom: 2px solid #2a2a4e; display: flex; align-items: center; padding: 0 40px;">
        <div style="color: #fff; font-size: 32px; font-weight: bold;">Image Editor</div>
      </div>
      
      <div class="clip" data-start="0" data-duration="15" data-track-index="1"
           style="position: absolute; top: 80px; left: 0; right: 0; bottom: 0; display: flex; padding: 40px; gap: 40px;">
        <div class="clip panel" data-start="0" data-duration="15" data-track-index="2">
          <div class="clip" data-start="1" data-duration="2" data-track-index="3" id="title-filters"
               style="font-size: 24px; font-weight: bold; margin-bottom: 30px; color: #4a90e2; opacity: 0;">
            Filter Editor
          </div>
          <div class="clip feature-box" data-start="3" data-duration="2" data-track-index="4" id="filter1">Brightness Filter</div>
          <div class="clip feature-box" data-start="5" data-duration="2" data-track-index="5" id="filter2">Contrast Filter</div>
          <div class="clip feature-box" data-start="7" data-duration="2" data-track-index="6" id="filter3">Saturation Filter</div>
        </div>
        
        <div class="clip preview-box" data-start="0" data-duration="15" data-track-index="7">
          <div class="clip" data-start="1" data-duration="2" data-track-index="8" id="preview-label" style="opacity: 0;">
            Image Preview
          </div>
        </div>
      </div>
      
      <div class="feature-label clip" data-start="1" data-duration="2" data-track-index="10" id="label1" style="top: 200px; left: 100px;">Filter Editor</div>
      <div class="feature-label clip" data-start="3" data-duration="2" data-track-index="11" id="label2" style="top: 200px; left: 100px;">Apply Filters</div>
      <div class="feature-label clip" data-start="5" data-duration="2" data-track-index="12" id="label3" style="top: 200px; left: 100px;">Preview Changes</div>
      <div class="feature-label clip" data-start="7" data-duration="2" data-track-index="13" id="label4" style="top: 200px; left: 100px;">Image Editor Complete</div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      
      tl.to('#title-filters', { opacity: 1, duration: 0.5 }, 1);
      tl.to('#label1', { opacity: 1, duration: 0.5 }, 1);
      tl.to('#label1', { opacity: 0, duration: 0.3 }, 2.5);
      
      tl.to('#filter1', { opacity: 1, duration: 0.5 }, 3);
      tl.to('#label2', { opacity: 1, duration: 0.5 }, 3);
      tl.to('#label2', { opacity: 0, duration: 0.3 }, 4.5);
      
      tl.to('#filter2', { opacity: 1, duration: 0.5 }, 5);
      tl.to('#label3', { opacity: 1, duration: 0.5 }, 5);
      tl.to('#label3', { opacity: 0, duration: 0.3 }, 6.5);
      
      tl.to('#filter3', { opacity: 1, duration: 0.5 }, 7);
      tl.to('#preview-label', { opacity: 1, duration: 0.5 }, 7);
      tl.to('#label4', { opacity: 1, duration: 0.5 }, 7);
      
      window.__timelines["image"] = tl;
    </script>
  </body>
</html>
