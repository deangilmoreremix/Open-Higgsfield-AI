<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0a0a0a;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }
      
      #root {
        width: 100%;
        height: 100%;
        position: relative;
      }
      
      .header {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 80px;
        background: #1a1a2e;
        border-bottom: 2px solid #2a2a4e;
        display: flex;
        align-items: center;
        padding: 0 40px;
      }
      
      .header-title {
        color: #fff;
        font-size: 32px;
        font-weight: bold;
      }
      
      .timeline-container {
        position: absolute;
        top: 80px;
        left: 0;
        right: 0;
        bottom: 100px;
        background: #0f0f1a;
      }
      
      .track {
        height: 120px;
        border-bottom: 1px solid #1a1a2e;
        position: relative;
        background: #0a0a0a;
        margin: 10px 0;
      }
      
      .track-label {
        position: absolute;
        left: 20px;
        top: 10px;
        color: #aaa;
        font-size: 16px;
        z-index: 10;
      }
      
      .clip {
        position: absolute;
        top: 20px;
        height: 80px;
        background: #4a90e2;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 14px;
        font-weight: bold;
      }
      
      .playhead {
        position: absolute;
        top: 0;
        width: 3px;
        height: 100%;
        background: #ff0000;
        z-index: 50;
        left: 200px;
      }
      
      .controls {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 100px;
        background: #1a1a2e;
        border-top: 2px solid #2a2a4e;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 30px;
      }
      
      .control-button {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        border: none;
        font-size: 24px;
        cursor: pointer;
        background: #2a2a4e;
        color: #fff;
      }
      
      .feature-label {
        position: absolute;
        color: #4a90e2;
        font-size: 28px;
        font-weight: bold;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="timeline"
      data-start="0"
      data-duration="30"
      data-width="1920"
      data-height="1080"
    >
      <!-- Header -->
      <div class="clip" data-start="0" data-duration="30" data-track-index="0" style="position: absolute; top: 0; left: 0; right: 0; height: 80px; background: #1a1a2e; border-bottom: 2px solid #2a2a4e; display: flex; align-items: center; padding: 0 40px;">
        <div style="color: #fff; font-size: 32px; font-weight: bold;">Timeline Editor</div>
      </div>
      
      <!-- Timeline -->
      <div class="clip" data-start="0" data-duration="30" data-track-index="1" style="position: absolute; top: 80px; left: 0; right: 0; bottom: 100px; background: #0f0f1a; overflow-y: auto;">
        <!-- Track 1 -->
        <div class="clip" data-start="0" data-duration="30" data-track-index="2" style="height: 120px; border-bottom: 1px solid #1a1a2e; position: relative; background: #0a0a0a; margin: 10px 0;">
          <div style="position: absolute; left: 20px; top: 10px; color: #aaa; font-size: 16px;">Video Track</div>
          <div class="clip" data-start="2" data-duration="6" data-track-index="3" style="position: absolute; top: 20px; left: 200px; width: 240px; height: 80px; background: #4a90e2; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 14px; font-weight: bold;">Intro</div>
          <div class="clip" data-start="8" data-duration="8" data-track-index="4" style="position: absolute; top: 20px; left: 520px; width: 320px; height: 80px; background: #4a90e2; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 14px; font-weight: bold;">Main Clip</div>
          <div class="clip" data-start="16" data-duration="6" data-track-index="5" style="position: absolute; top: 20px; left: 920px; width: 240px; height: 80px; background: #4a90e2; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 14px; font-weight: bold;">Outro</div>
        </div>
        
        <!-- Track 2 -->
        <div class="clip" data-start="0" data-duration="30" data-track-index="6" style="height: 120px; border-bottom: 1px solid #1a1a2e; position: relative; background: #0a0a0a; margin: 10px 0;">
          <div style="position: absolute; left: 20px; top: 10px; color: #aaa; font-size: 16px;">Audio Track</div>
          <div class="clip" data-start="2" data-duration="25" data-track-index="7" style="position: absolute; top: 20px; left: 200px; width: 1000px; height: 80px; background: #50c878; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 14px; font-weight: bold;">Background Music</div>
        </div>
      </div>
      
      <!-- Playhead -->
      <div class="clip" data-start="2" data-duration="20" data-track-index="8" id="playhead" style="position: absolute; top: 80px; width: 3px; height: 880px; background: #ff0000; z-index: 50; left: 200px;"></div>
      
      <!-- Controls -->
      <div class="clip" data-start="0" data-duration="30" data-track-index="9" style="position: absolute; bottom: 0; left: 0; right: 0; height: 100px; background: #1a1a2e; border-top: 2px solid #2a2a4e; display: flex; align-items: center; justify-content: center; gap: 30px;">
        <button class="clip" data-start="3" data-duration="2" data-track-index="10" style="width: 60px; height: 60px; border-radius: 50%; border: none; font-size: 24px; cursor: pointer; background: #4a90e2; color: #fff;">▶</button>
        <button class="clip" data-start="5" data-duration="2" data-track-index="11" style="width: 60px; height: 60px; border-radius: 50%; border: none; font-size: 24px; cursor: pointer; background: #2a2a4e; color: #fff;">⏸</button>
        <button class="clip" data-start="7" data-duration="2" data-track-index="12" style="width: 60px; height: 60px; border-radius: 50%; border: none; font-size: 24px; cursor: pointer; background: #2a2a4e; color: #fff;">⏹</button>
      </div>
      
      <!-- Feature Labels -->
      <div class="feature-label clip" data-start="2" data-duration="2" data-track-index="11" id="label1" style="top: 300px; left: 100px;">Multi-Track Timeline</div>
      <div class="feature-label clip" data-start="8" data-duration="2" data-track-index="11" id="label2" style="top: 300px; left: 100px;">Clip Management</div>
      <div class="feature-label clip" data-start="14" data-duration="2" data-track-index="11" id="label3" style="top: 300px; left: 100px;">Playback Controls</div>
      <div class="feature-label clip" data-start="20" data-duration="10" data-track-index="11" id="label4" style="top: 500px; left: 600px; font-size: 48px;">Timeline Editor - Demo Complete</div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      
      // Playhead animation
      tl.to('#playhead', {
        left: 1500,
        duration: 20,
        ease: 'none'
      }, 2);
      
      // Feature labels fade in/out
      tl.to('#label1', { opacity: 1, duration: 0.5 }, 2);
      tl.to('#label1', { opacity: 0, duration: 0.3 }, 4);
      
      tl.to('#label2', { opacity: 1, duration: 0.5 }, 8);
      tl.to('#label2', { opacity: 0, duration: 0.3 }, 10);
      
      tl.to('#label3', { opacity: 1, duration: 0.5 }, 14);
      tl.to('#label3', { opacity: 0, duration: 0.3 }, 16);
      
      tl.to('#label4', { opacity: 1, duration: 0.5 }, 20);
      
      window.__timelines["timeline"] = tl;
    </script>
  </body>
</html>
